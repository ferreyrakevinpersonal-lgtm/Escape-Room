<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Interactiva</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }

    .terminal {
      width: 90%;
      max-width: 700px;
      background-color: #1e1e1e;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal-header {
      background-color: #323232;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }

    .title {
      color: #a0a0a0;
      font-size: 0.85rem;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .terminal-body {
      padding: 20px;
      color: #4af626;
      font-size: 1.1rem;
      line-height: 1.5;
      min-height: 250px;
    } 
    #typed-text, .command-output {
      white-space: pre-wrap;
    }
    .terminal-img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 6px;
      margin: 10px 0;
      display: block;
    }

    .input-line {
      display: none;
      align-items: center;
      margin-top: 5px;
    }

    .prompt-label {
      color: #4af626;
      margin-right: 5px;
    }

    .cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: #4af626;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      flex: 1;
      caret-color: #4af626;
    }

    .error-msg {
      color: #ff5f56;
    }
  </style>
</head>
<body>

  <div class="terminal" onclick="focusInput()">
    <div class="terminal-header">
      <span class="btn close"></span>
      <span class="btn minimize"></span>
      <span class="btn maximize"></span>
      <span class="title">C:\WINDOWS\system32\cmd.exe</span>
    </div>
    <div class="terminal-body" id="terminal-content">
      <span id="typed-text"></span>
      
      <div class="input-line" id="interactive-line">
        <span class="prompt-label">C:\Documents and Settings\User></span>
        <input type="text" id="cmd-input" class="cmd-input" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <script>
    const textHeader = `Microsoft Windows [Version 5.2.3790]
<C> Copyright 1985-2003 Microsoft Corp.

`;

    const typingSpeed = 25;
    const targetElement = document.getElementById("typed-text");
    const interactiveLine = document.getElementById("interactive-line");
    const cmdInput = document.getElementById("cmd-input");
    const terminalContent = document.getElementById("terminal-content");

    let index = 0;

    function typeWriter() {
      if (index < textHeader.length) {
        targetElement.textContent += textHeader.charAt(index);
        index++;
        setTimeout(typeWriter, typingSpeed);
      } else {
        interactiveLine.style.display = "flex";
        cmdInput.focus();
      }
    }

    function focusInput() {
      if (interactiveLine.style.display === "flex") {
        cmdInput.focus();
      }
    }

    cmdInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        const command = cmdInput.value.trim();
        
        const historyLine = document.createElement("div");
        historyLine.className = "command-output";
        historyLine.textContent = `C:\\Documents and Settings\\User> ${command}`;
        terminalContent.insertBefore(historyLine, interactiveLine);

        if (command !== "") {
          const responseLine = document.createElement("div");
          responseLine.className = "command-output";
          const cleanCommand = command.toLowerCase();

          if (cleanCommand === "genio") {
            // 1. Crear e intentar reproducir el audio
            const audio = new Audio("geniocorte.mp3");
            audio.play().then(() => {
              responseLine.textContent = "Reproduciendo ...";
            }).catch(() => {
              responseLine.textContent = "Error o bloqueo al reproducir 'geniocorte.mp3'.";
            });
            terminalContent.insertBefore(responseLine, interactiveLine);

            // 2. Crear la imagen con verificación de errores
            const img = document.createElement("img");
            img.src = "GENIO.jpg";
            img.alt = "GENIO";
            img.className = "terminal-img command-output";

            // Si la imagen falla al cargar, muestra un mensaje explícito en pantalla
            img.onerror = function() {
              const imgError = document.createElement("div");
              imgError.className = "command-output error-msg";
              imgError.textContent = " Error: No se encontró el archivo 'GENIO.jpg'. Revisa si es .png, .jpeg o si el archivo está en la misma carpeta.";
              terminalContent.insertBefore(imgError, interactiveLine);
              img.remove();
            };

            terminalContent.insertBefore(img, interactiveLine);

          } else if (cleanCommand === "help") {
            responseLine.textContent = "Comandos disponibles: genio, help, dir, cls, date";
            terminalContent.insertBefore(responseLine, interactiveLine);
          } else if (cleanCommand === "cls") {
            document.querySelectorAll(".command-output").forEach(el => el.remove());
            cmdInput.value = "";
            return;
          } else if (cleanCommand === "dir") {
            responseLine.textContent = " Directorio de C:\\Documents and Settings\\User\n\n01/10/2026  12:00 PM    AUDIO          geniocorte.mp3\n01/10/2026  12:00 PM    IMAGEN         GENIO.jpg";
            terminalContent.insertBefore(responseLine, interactiveLine);
          } else if (cleanCommand === "date") {
            responseLine.textContent = `La fecha actual es: ${new Date().toLocaleDateString()}`;
            terminalContent.insertBefore(responseLine, interactiveLine);
          } else {
            responseLine.textContent = `'${command}' no se reconoce como un comando interno o externo.`;
            terminalContent.insertBefore(responseLine, interactiveLine);
          }
        }

        cmdInput.value = "";
      }
    });

    document.addEventListener("DOMContentLoaded", typeWriter);
  </script>
</body>
</html>
